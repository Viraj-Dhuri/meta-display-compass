<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="A Meta Ray-Ban Display Web App compass using device orientation sensors.">
  <meta name="theme-color" content="#000000">
  <title>Facing Direction</title>
  <style>
    :root {
      --canvas: #000000;
      --surface: #101216;
      --surface-2: #1c1e21;
      --text: #ffffff;
      --muted: #b0b3b8;
      --cyan: #42e8ff;
      --green: #7cff9b;
      --amber: #ffd36a;
      --line: rgba(255, 255, 255, 0.2);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 600px;
      height: 600px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .app {
      width: 600px;
      height: 600px;
      padding: 24px;
      display: grid;
      grid-template-rows: 72px 1fr 96px;
      gap: 12px;
      background: var(--canvas);
    }

    .topbar,
    .panel,
    .footer {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 18, 22, 0.88);
      mix-blend-mode: plus-lighter;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    .sensor-state {
      color: var(--amber);
      font-size: 16px;
      font-weight: 800;
      text-align: right;
    }

    .panel {
      display: grid;
      place-items: center;
      padding: 24px;
      outline: none;
    }

    .panel.focusable:focus-visible {
      border-color: var(--cyan);
      box-shadow:
        0 0 0 4px rgba(66, 232, 255, 0.22),
        0 0 34px rgba(66, 232, 255, 0.26);
    }

    .direction {
      display: grid;
      gap: 18px;
      justify-items: center;
      text-align: center;
    }

    .heading {
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
    }

    .cardinal {
      min-height: 122px;
      color: var(--cyan);
      font-size: 96px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow:
        0 0 22px rgba(66, 232, 255, 0.65),
        0 0 58px rgba(66, 232, 255, 0.34);
    }

    .degrees {
      color: var(--text);
      font: 800 40px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .message {
      min-height: 44px;
      max-width: 430px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.25;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 144px;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
    }

    .hint {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
    }

    .keycap {
      width: 144px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
    }

    .is-live .sensor-state {
      color: var(--green);
    }

    .is-live .cardinal {
      color: var(--green);
      text-shadow:
        0 0 22px rgba(124, 255, 155, 0.7),
        0 0 64px rgba(66, 232, 255, 0.32);
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Facing Direction Compass">
    <header class="topbar">
      <h1>Facing Direction</h1>
      <div class="sensor-state" id="sensorState">WAITING</div>
    </header>

    <section
      class="panel focusable"
      id="panel"
      tabindex="0"
      aria-label="Compass readout. Press Enter to start sensors."
      role="button"
    >
      <div class="direction" aria-live="polite">
        <div class="heading">You are facing</div>
        <div class="cardinal" id="cardinal">--</div>
        <div class="degrees" id="degrees">--- deg</div>
        <div class="message" id="message">Press Enter to start compass sensors.</div>
      </div>
    </section>

    <footer class="footer">
      <div class="hint">
        <span>Enter starts or retries sensor access.</span>
        <span>Use Chrome DevTools Sensors to test on desktop.</span>
      </div>
      <div class="keycap" aria-hidden="true">ENTER</div>
    </footer>
  </main>

  <script>
    const app = document.getElementById("app");
    const panel = document.getElementById("panel");
    const sensorState = document.getElementById("sensorState");
    const cardinal = document.getElementById("cardinal");
    const degrees = document.getElementById("degrees");
    const message = document.getElementById("message");

    let listening = false;
    let smoothedHeading = null;

    function normalizeDegrees(value) {
      return ((value % 360) + 360) % 360;
    }

    function directionFromHeading(heading) {
      const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return directions[Math.round(heading / 45) % directions.length];
    }

    function smoothHeading(next) {
      if (smoothedHeading === null) {
        smoothedHeading = next;
        return next;
      }

      const delta = ((next - smoothedHeading + 540) % 360) - 180;
      smoothedHeading = normalizeDegrees(smoothedHeading + delta * 0.18);
      return smoothedHeading;
    }

    function setStatus(state, text) {
      sensorState.textContent = state;
      message.textContent = text;
      app.classList.toggle("is-live", state === "LIVE");
    }

    function renderHeading(rawHeading) {
      const heading = smoothHeading(normalizeDegrees(rawHeading));
      cardinal.textContent = directionFromHeading(heading);
      degrees.textContent = `${String(Math.round(heading)).padStart(3, "0")} deg`;
      setStatus("LIVE", "Compass is reading device orientation.");
    }

    function onOrientation(event) {
      const iosHeading = event.webkitCompassHeading;
      const alpha = event.alpha;

      if (typeof iosHeading === "number") {
        renderHeading(iosHeading);
        return;
      }

      if (typeof alpha === "number") {
        renderHeading(360 - alpha);
        return;
      }

      setStatus("NO DATA", "This browser sent orientation events without heading data.");
    }

    async function startCompass() {
      if (!("DeviceOrientationEvent" in window)) {
        setStatus("NO SENSOR", "Device orientation is not available in this browser.");
        return;
      }

      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            setStatus("DENIED", "Sensor permission was not granted.");
            return;
          }
        }

        if (!listening) {
          window.addEventListener("deviceorientation", onOrientation, true);
          listening = true;
        }

        setStatus("STARTING", "Move or turn slightly while sensor data starts.");
      } catch (error) {
        setStatus("ERROR", "Sensor access failed. Try again from HTTPS or on-device.");
      }
    }

    function handleKey(event) {
      if (event.key !== "Enter") {
        return;
      }

      event.preventDefault();
      startCompass();
    }

    document.addEventListener("keydown", handleKey);
    panel.addEventListener("click", startCompass);

    window.addEventListener("load", () => {
      panel.focus();
    });
  </script>
</body>
</html>
